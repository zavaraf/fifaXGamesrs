# ===========================================
# FIFA X Gamers - PRODUCCIÓN (JVMHost)
# ===========================================

# Nombre de la aplicación
spring.application.name=fifaapp

# ===========================================
# Base de Datos - Producción
# ===========================================
spring.datasource.url=jdbc:mysql://ud4.nodecluster.net:3306/fifaxgam_fifaxgamersbd?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&noAccessToProcedureBodies=true
spring.datasource.username=fifaxgam_fifaApp
spring.datasource.password=${DB_PASSWORD:FifaRoot#}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================================
# HikariCP - Optimizado para 256MB RAM
# ===========================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===========================================
# Jackson (JSON)
# ===========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Mexico_City

# ===========================================
# Logging - Producción (menos verbose)
# ===========================================
logging.level.root=WARN
logging.level.com.fifaxgamers=INFO
logging.level.com.app=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# ===========================================
# Actuator - Solo health en producción
# ===========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ===========================================
# JWT Configuration
# ===========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
