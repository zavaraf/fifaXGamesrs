# ===========================================
# FIFA X Gamers - Spring Boot 3 Configuration
# ===========================================

# Nombre de la aplicación
spring.application.name=fifaapp

# ===========================================
# Configuración del Servidor
# ===========================================
server.port=8080
server.servlet.context-path=/

# ===========================================
# Perfiles de Spring
# ===========================================
# Cambiar a 'prod' para producción
spring.profiles.active=dev

# ===========================================
# Base de Datos - Desarrollo (Local)
# ===========================================
spring.datasource.url=jdbc:mysql://localhost:3306/fifaxgamersbd?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================================
# Configuración de HikariCP (Connection Pool)
# ===========================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===========================================
# Jackson (JSON)
# ===========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Mexico_City

# ===========================================
# Logging
# ===========================================
logging.level.root=INFO
logging.level.com.fifaxgamers=DEBUG
logging.level.com.app=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Formato de logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===========================================
# Actuator (Monitoreo)
# ===========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ===========================================
# JWT Configuration
# ===========================================
jwt.secret=${JWT_SECRET:miClaveSecretaMuyLargaYSeguraParaJWT2024}
jwt.expiration=3600000

# ===========================================
# Configuración específica para Tomcat externo
# ===========================================
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto
